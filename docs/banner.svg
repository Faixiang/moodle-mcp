<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="moodle-mcp — Moodle Web Service API as MCP tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f98012"/>
      <stop offset="100%" stop-color="#ffb457"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g stroke="url(#line)" stroke-opacity="0.55" stroke-width="1.2" fill="none">
    <path d="M905 70 L1010 128 L1010 214 L905 262 L800 214 L800 128 Z"/>
    <path d="M905 70 L800 214 M905 70 L1010 214 M800 128 L1010 128 M800 214 L1010 214 M905 262 L905 128"/>
    <circle cx="1010" cy="128" r="3.5" fill="#8b5cf6" stroke="none"/>
    <circle cx="800" cy="214" r="3.5" fill="#3b82f6" stroke="none"/>
    <circle cx="905" cy="262" r="3.5" fill="#8b5cf6" stroke="none"/>
  </g>

  <text x="80" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">moodle-mcp</text>
  <rect x="80" y="140" width="132" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#9fb0c9">Moodle Web Service API, exposed as MCP tools</text>
  <text x="80" y="228" font-family="Consolas, Menlo, monospace" font-size="18" fill="#6b7f9c">no browser  ·  no scraper  ·  zero dependencies  ·  read-only</text>

  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <rect x="80" y="252" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.06"/>
    <text x="104" y="272" fill="#c9d6e8">python 3.8+</text>
    <rect x="220" y="252" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.06"/>
    <text x="244" y="272" fill="#c9d6e8">mcp 2024-11-05</text>
    <rect x="360" y="252" width="142" height="30" rx="15" fill="#ffffff" fill-opacity="0.06"/>
    <text x="384" y="272" fill="#c9d6e8">moodle 3.x / 4.x</text>
  </g>
</svg>
